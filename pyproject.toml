[project]
name = "ai-groupmate"
version = "0.1.0"
description = "AI groupmate Discord bot for a private friend group"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Discord
    "discord.py>=2.4.0",

    # LLM — Z.ai is OpenAI-compatible, so we use the openai SDK pointed at Z.ai.
    "openai>=1.40.0",
    "tiktoken>=0.7.0",  # token counting for context budgeting

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",       # async SQLite driver
    "alembic>=1.13.0",

    # Scheduler (Phase 3 — installed now so it's ready)
    "apscheduler>=3.10.0",

    # Natural-language time parsing (Phase 3 reminders/timers)
    "dateparser>=1.2.0",
    "pytz>=2024.1",

    # HTTP for custom API tools (Phase 4)
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.1.0",

    # Env
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
postgres = [
    "asyncpg>=0.29.0",  # for production postgres
]

[project.scripts]
groupmate = "app.main:main"

# Explicit package list — setuptools auto-discovery fails with the nested
# package layout (config/, bot/, ai/ etc. all under app/).
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "alembic*", "tests*", "venv*", ".venv*"]

# ── Tooling config ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default arg — common in pydantic
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
